ext-align:left}th{color:#aebbd0}.list{display:grid;gap:10px}.item{padding:12px;border:1px solid var(--line);border-radius:11px;background:#0c1523}.item .title{font-weight:700;margin-bottom:4px}.item .meta{font-size:12px;color:var(--muted)}.btn{background:#172238;color:#fff;border:1px solid #30405c;padding:8px 11px;border-radius:9px;cursor:pointer}.btn.primary{background:#59461f;border-color:#8a6d32}.btn.danger{border-color:#6f3333;color:#ffb4b4}.hero{padding:18px 20px;border:1px solid #5a4729;background:linear-gradient(120deg,#1c2333,#171c25 55%,#2a2115);border-radius:14px;margin-bottom:14px}.footer{margin-top:28px;color:var(--muted);font-size:12px}.bar{height:8px;background:#1b2941;border-radius:999px;overflow:hidden}.bar>span{display:block;height:100%;background:linear-gradient(90deg,#d8ad5b,#7eb4ff)}.chartbox{height:290px;width:100%}.spark{width:110px;height:34px;display:inline-block;vertical-align:middle}.rangebar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.rangebar button{background:#0d1624;border:1px solid var(--line);color:var(--muted);padding:6px 9px;border-radius:8px;cursor:pointer}.rangebar button.active{color:#fff;border-color:#8a6d32;background:#2a2115}.ticker{color:#fff;font-weight:700;cursor:pointer;text-decoration:none}.ticker:hover{color:#f2ce83}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}.modalbox{width:min(860px,96vw);max-height:92vh;overflow:auto;background:#101827;border:1px solid var(--line);border-radius:16px;padding:18px}.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field{display:grid;gap:5px}.field label{font-size:12px;color:var(--muted)}.field input,.field select{width:100%;background:#0b1320;color:#fff;border:1px solid var(--line);border-radius:8px;padding:9px}.editor-row{display:grid;grid-template-columns:2.4fr .9fr .9fr 1.2fr auto;gap:7px;margin-bottom:8px}.editor-row input,.editor-row select{min-width:0}.detail-h <script>
(function(){'use strict';
var DEMO={portfolio:{name:'Demo Multi-Asset',baseCurrency:'THB',cash:[{currency:'THB',amount:85000},{currency:'USD',amount:2100}],holdings:[
{symbol:'HANA.BK',name:'Hana Microelectronics',asset:'Equity',qty:1200,avg:39.75,price:42.25,currency:'THB',day:1.6,yieldPct:2.1,risk:58},{symbol:'CCET.BK',name:'Cal-Comp Electronics',asset:'Equity',qty:5000,avg:8.85,price:9.20,currency:'THB',day:-0.5,yieldPct:1.8,risk:64},{symbol:'BGRIM.BK',name:'B.Grimm Power',asset:'Equity',qty:1500,avg:17.5,price:18.1,currency:'THB',day:.8,yieldPct:2.3,risk:52},{symbol:'BRO',name:'Brown & Brown',asset:'Equity',qty:20,avg:69.13,price:72.4,currency:'USD',day:.4,yieldPct:.6,risk:34},{symbol:'TGTX',name:'TG Therapeutics',asset:'Equity',qty:25,avg:41.64,price:45.9,currency:'USD',day:2.7,yieldPct:0,risk:78},{symbol:'SPY',name:'SPDR S&P 500 ETF',asset:'ETF',qty:5,avg:630,price:642,currency:'USD',day:.2,yieldPct:1.2,risk:22},{symbol:'BIL',name:'SPDR 1-3 Month T-Bill ETF',asset:'ETF',qty:10,avg:91.4,price:91.6,currency:'USD',day:.01,yieldPct:4.1,risk:8},{symbol:'BTC/USD',name:'Bitcoin',asset:'Crypto',qty:.05,avg:105000,price:108200,currency:'USD',day:1.1,yieldPct:0,risk:82}]},events:[],dividends:[],earnings:[],news:[],research:[],analysts:[],settings:{timezone:'Asia/Bangkok',withholdingTax:10,mode:'OFFLINE DEMO'}};
function clone(o){return JSON.parse(JSON.stringify(o))}var DATA=clone(DEMO),current='Dashboard',detailSymbol=null,portRange='1Y',assetRange='1Y',externalLoaded=false,marketOnline=false,refreshing=false,lastSyncAt=null,autoRefreshMs=30000,autoTimer=null,nextSyncAt=0;var LS='portfolioPulsePortfolioV5';
function byId(id){return document.getElementById(id)}function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}function fx(c){return c==='USD'?35.8:1}function value(h){return +h.qty*+h.price*fx(h.currency)}function cost(h){return +h.qty*+h.avg*fx(h.currency)}function fmt(n,d){return new Intl.NumberFormat('en-US',{maximumFractionDigits:d==null?0:d}).format(+n||0)}
function metrics(){var hs=DATA.portfolio.holdings.filter(function(h){return +h.qty>0}),invested=hs.reduce(function(a,h){return a+value(h)},0),cst=hs.reduce(function(a,h){return a+cost(h)},0),cash=DATA.portfolio.cash.reduce(function(a,c){return a+(+c.amount||0)*fx(c.currency)},0),prev=hs.reduce(function(a,h){var v=value(h),r=(+h.day||0)/100;return a+(1+r>0?v/(1+r):v)},0),day=invested-prev;return{invested:invested,cost:cst,cash:cash,net:invested+cash,pnl:invested-cst,dayPct:prev?day/prev*100:0,totalOpenPct:cst?(invested-cst)/cst*100:0}}
function seedFromSymbol(s){var x=2166136261;for(var i=0;i<s.length;i++){x^=s.charCodeAt(i);x+=(x<<1)+(x<<4)+(x<<7)+(x<<8)+(x<<24)}return x>>>0}function rndObj(seed){return function(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}}
function periodPoints(range){return {'1D':48,'1W':56,'1M':62,'3M':65,'YTD':72,'1Y':104,'5Y':130,'ALL':160}[range]||104}
function synthSeries(symbol,last,range){var n=periodPoints(range),r=rndObj(seedFromSymbol(symbol+range)),arr=[],start=last*(.58+r()*.32),v=start;for(var i=0;i<n;i++){var drift=(last-start)/n;v=Math.max(.01,v+drift+(r()-.48)*last*(range==='1D'?.003:.018));arr.push(v)}arr[n-1]=last;return arr}
function seriesFor(h,range){if(h.history&&h.history[range]&&h.history[range].length)return h.history[range];return synthSeries(h.symbol,+h.price||1,range)}
function portSeries(range){var hs=DATA.portfolio.holdings.filter(function(h){return +h.qty>0}),n=periodPoints(range),cash=DATA.portfolio.cash.reduce(function(a,c){return a+(+c.amount||0)*fx(c.currency)},0),sets=hs.map(function(h){return seriesFor(h,range)});var out=[];for(var i=0;i<n;i++){var total=cash;for(var j=0;j<hs.length;j++){var s=sets[j],idx=Math.min(s.length-1,Math.round(i*(s.length-1)/(n-1)));total+=s[idx]*(+hs[j].qty||0)*fx(hs[j].currency)}out.push(total)}return out}
function svgLine(vals,w,h,mini){w=w||760;h=h||260;var pad=mini?2:16,min=Math.min.apply(null,vals),max=Math.max.apply(null,vals);if(max===min)max=min+1;var pts=vals.map(function(v,i){var x=pad+i*(w-2*pad)/(vals.length-1),y=h-pad-(v-min)*(h-2*pad)/(max-min);return x.toFixed(1)+','+y.toFixed(1)}).join(' '),up=vals[vals.length-1]>=vals[0],stroke=up?'#2ecb81':'#f26464';return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="100%" preserveAspectRatio="none"><polyline fill="none" stroke="'+stroke+'" stroke-width="'+(mini?2:3)+'" points="'+pts+'"/>'+(mini?'':'<line x1="'+pad+'" y1="'+(h-pad)+'" x2="'+(w-pad)+'" y2="'+(h-pad)+'" stroke="#263247"/>')+'</svg>'}
function rangeBar(active,kind){var rs=['1D','1W','1M','3M','YTD','1Y','5Y','ALL'];return '<div class="rangebar">'+rs.map(function(r){return '<button data-range="'+r+'" data-kind="'+kind+'" class="'+(r===active?'active':'')+'">'+r+'</button>'}).join('')+'</div>'}
function nav(){var items=['Dashboard','Portfolio','Events','Dividends','Earnings','News','SA Research','Analysts','Alerts','Settings'];return '<aside class="sidebar"><div class="brand">PORTFOLIO <span>PULSE AI</span></div><div class="nav">'+items.map(function(i){return '<button data-nav="'+i+'" class="'+(i===current&&!detailSymbol?'active':'')+'">'+i+'</button>'}).join('')+'</div></aside>'}
function top(){var sync=lastSyncAt?('Last sync '+new Date(lastSyncAt).toLocaleTimeString()):'Not synced yet';return '<div class="topbar"><div><h1>'+esc(detailSymbol?'Asset Detail':current)+'</h1><div class="muted">'+esc(DATA.portfolio.name)+' · '+esc(DATA.portfolio.baseCurrency)+'</div></div><div class="chips"><span class="chip '+(marketOnline?'gold':'')+'">'+(marketOnline?'MARKET API CONNECTED':'DEMO / API OFFLINE')+'</span><span class="chip" id="syncChip">'+esc(sync)+'</span><span class="chip">Auto '+Math.round(autoRefreshMs/1000)+'s</span></div></div>'}
function kpi(l,v,c){return '<div class="card"><div class="label">'+l+'</div><div class="value '+(c||'')+'">'+v+'</div></div>'}
function dashboard(){var m=metrics(),vals=portSeries(portRange);return '<div class="hero"><h2>What matters now</h2><div class="muted">Open portfolio value, cash and market history in one view.</div></div><div class="grid kpis">'+kpi('Net Worth','฿'+fmt(m.net))+kpi('Invested','฿'+fmt(m.invested))+kpi('Cash','฿'+fmt(m.cash))+kpi('Total P&L','฿'+fmt(m.pnl),m.pnl>=0?'pos':'neg')+kpi('Open Positions · Today %',(m.dayPct>=0?'+':'')+m.dayPct.toFixed(2)+'%',m.dayPct>=0?'pos':'neg')+kpi('Open Positions · Total %',(m.totalOpenPct>=0?'+':'')+m.totalOpenPct.toFixed(2)+'%',m.totalOpenPct>=0?'pos':'neg')+'</div><div class="card" style="margin-top:14px"><div class="section-title"><div><h2>Portfolio Value</h2><div class="subtle">'+(externalLoaded?'JSON/server data + cached history':'Demo/cached history until a historical data provider is connected')+'</div></div><strong>฿'+fmt(vals[vals.length-1])+'</strong></div>'+rangeBar(portRange,'portfolio')+'<div class="chartbox">'+svgLine(vals,900,290,false)+'</div></div>'}
function spark(h){return '<span class="spark">'+svgLine(seriesFor(h,'1Y'),110,34,true)+'</span>'}
function portfolio(){var m=metrics();return '<div class="section-title"><div><h2>'+esc(DATA.portfolio.name)+'</h2><div class="subtle">Click ticker for full price history</div></div><div class="toolbar"><button id="editPort" class="btn primary">Manage Positions</button><button id="refreshQuotes" class="btn">Refresh Market Data</button><button id="exportBtn" class="btn">Export CSV</button><button id="exportJson" class="btn">Export JSON</button></div></div><div class="card"><table><thead><tr><th>Symbol</th><th>Name</th><th>1Y</th><th>Qty</th><th>Avg Cost</th><th>Market Price</th><th>CCY</th><th>Value (THB)</th><th>Weight</th><th>Day</th><th>P&L</th></tr></thead><tbody>'+DATA.portfolio.holdings.map(function(h){var v=value(h),p=v-cost(h);return '<tr><td><a class="ticker" data-symbol="'+esc(h.symbol)+'">'+esc(h.symbol)+'</a></td><td>'+esc(h.name)+'</td><td>'+spark(h)+'</td><td>'+fmt(h.qty,4)+'</td><td>'+fmt(h.avg,4)+'</td><td>'+fmt(h.price,4)+'</td><td>'+esc(h.currency)+'</td><td>'+fmt(v)+'</td><td>'+(m.invested?v/m.invested*100:0).toFixed(1)+'%</td><td class="'+(+h.day>=0?'pos':'neg')+'">'+(+h.day||0).toFixed(2)+'%</td><td class="'+(p>=0?'pos':'neg')+'">'+fmt(p)+'</td></tr>'}).join('')+'</tbody></table></div>'}
function assetDetail(){var h=DATA.portfolio.holdings.filter(function(x){return x.symbol===detailSymbol})[0];if(!h)return '<div class="card">Asset not found.</div>';var vals=seriesFor(h,assetRange),chg=(vals[vals.length-1]/vals[0]-1)*100,pnl=value(h)-cost(h);return '<div class="detail-head"><div><div class="back" id="backPort">← Back to Portfolio</div><h2 style="margin:7px 0 0">'+esc(h.symbol)+' · '+esc(h.name)+'</h2><div class="muted">'+esc(h.asset)+' · '+esc(h.currency)+'</div></div><div><div class="value">'+fmt(h.price,4)+' '+esc(h.currency)+'</div><div class="subtle">'+esc(h.quoteProvider||'cached')+(h.quoteTime?' · '+esc(h.quoteTime):'')+'</div><div class="'+(chg>=0?'pos':'neg')+'">'+(chg>=0?'+':'')+chg.toFixed(2)+'% · '+assetRange+'</div></div></div><div class="grid kpis">'+kpi('Quantity',fmt(h.qty,4))+kpi('Avg Cost',fmt(h.avg,4)+' '+h.currency)+kpi('Market Value','฿'+fmt(value(h)))+kpi('Open P&L','฿'+fmt(pnl),pnl>=0?'pos':'neg')+kpi('Today',(+h.day>=0?'+':'')+(+h.day||0).toFixed(2)+'%',+h.day>=0?'pos':'neg')+kpi('Risk',esc(h.risk||'-'))+'</div><div class="card" style="margin-top:14px"><h3>Price History</h3>'+rangeBar(assetRange,'asset')+'<div class="chartbox">'+svgLine(vals,900,290,false)+'</div><div class="subtle">Historical series uses embedded/cached data when available; otherwise clearly remains demo-generated until a live historical provider is connected.</div></div>'}
function simple(){return '<div class="card"><h3>'+esc(current)+'</h3><div class="muted">Module retained from portable build.</div></div>'}
function render(){var body=detailSymbol?assetDetail():(current==='Dashboard'?dashboard():current==='Portfolio'?portfolio():simple());byId('app').innerHTML='<div class="shell">'+nav()+'<main class="main">'+top()+body+'<div class="footer">Decision-support software. Position data saves in this browser. Market price/ticker metadata are provider-controlled; you only edit quantity and average cost. Export JSON to move data between devices.</div></main></div>';bind()}
function bind(){Array.prototype.forEach.call(document.querySelectorAll('[data-nav]'),function(b){b.onclick=function(){detailSymbol=null;current=this.getAttribute('data-nav');render()}});Array.prototype.forEach.call(document.querySelectorAll('[data-symbol]'),function(a){a.onclick=function(){detailSymbol=this.getAttribute('data-symbol');assetRange='1Y';render()}});Array.prototype.forEach.call(document.querySelectorAll('[data-range]'),function(b){b.onclick=function(){if(this.getAttribute('data-kind')==='portfolio')portRange=this.getAttribute('data-range');else assetRange=this.getAttribute('data-range');render();refreshVisibleHistories()}});var x=byId('backPort');if(x)x.onclick=function(){detailSymbol=null;current='Portfolio';render()};var e=byId('editPort');if(e)e.onclick=openEditor;var rq=byId('refreshQuotes');if(rq)rq.onclick=function(){refreshQuotes(true)};var c=byId('exportBtn');if(c)c.onclick=exportCSV;var j=byId('exportJson');if(j)j.onclick=exportJSON}
function openEditor(){var rows=DATA.portfolio.holdings.map(function(h,i){return '<div class="editor-row" data-i="'+i+'"><div><b>'+esc(h.symbol)+'</b><div class="subtle">'+esc(h.name)+' · '+esc(h.exchange||'')+' · '+esc(h.currency||'')+'</div></div><input data-f="qty" type="number" step="any" value="'+esc(h.qty)+'" title="Quantity"><input data-f="avg" type="number" step="any" value="'+esc(h.avg)+'" title="Average cost"><div class="subtle" style="align-self:center">Market price is automatic</div><button class="btn danger" data-del="'+i+'">Delete</button></div>'}).join('');var d=document.createElement('div');d.className='modal';d.id='editorModal';d.innerHTML='<div class="modalbox"><div class="section-title"><div><h2>Manage Positions</h2><div class="subtle">You only enter quantity and average cost. Ticker, name, currency and market price come from market-data providers.</div></div><button class="btn" id="closeEdit">Close</button></div><div id="editRows">'+rows+'</div><div class="toolbar" style="margin-top:14px"><button class="btn" id="addHolding">+ Search & Add Stock</button><button class="btn primary" id="saveHolding">Save Positions</button></div></div>';document.body.appendChild(d);bindEditor()}
function bindEditor(){byId('closeEdit').onclick=function(){byId('editorModal').remove()};byId('addHolding').onclick=openSearchModal;Array.prototype.forEach.call(document.querySelectorAll('[data-del]'),function(b){b.onclick=function(){DATA.portfolio.holdings.splice(+this.getAttribute('data-del'),1);persist();byId('editorModal').remove();openEditor()}});byId('saveHolding').onclick=function(){Array.prototype.forEach.call(document.querySelectorAll('.editor-row'),function(row){var i=+row.getAttribute('data-i'),h=DATA.portfolio.holdings[i];Array.prototype.forEach.call(row.querySelectorAll('[data-f]'),function(el){h[el.getAttribute('data-f')]=+el.value||0})});persist();byId('editorModal').remove();render();refreshQuotes()}}
function openSearchModal(){var old=byId('searchModal');if(old)old.remove();var d=document.createElement('div');d.className='modal';d.id='searchModal';d.innerHTML='<div class="modalbox" style="width:min(720px,96vw)"><div class="section-title"><div><h2>Search Market Ticker</h2><div class="subtle">Search by company name or ticker. Results come from configured market-data providers.</div></div><button class="btn" id="closeSearch">Close</button></div><div class="field" style="margin-top:12px"><input id="tickerSearch" placeholder="e.g. Microsoft, AAPL, HANA" autocomplete="off"></div><div id="searchStatus" class="subtle" style="margin:10px 0">Start typing at least 2 characters.</div><div id="searchResults" class="list"></div></div>';document.body.appendChild(d);byId('closeSearch').onclick=function(){d.remove()};var timer;byId('tickerSearch').oninput=function(){clearTimeout(timer);var q=this.value.trim();if(q.length<2){byId('searchResults').innerHTML='';byId('searchStatus').textContent='Start typing at least 2 characters.';return}timer=setTimeout(function(){runTickerSearch(q)},280)};setTimeout(function(){byId('tickerSearch').focus()},50)}
function apiJSON(url){return fetch(url,{cache:'no-store'}).then(function(r){var ct=(r.headers.get('content-type')||'').toLowerCase();if(ct.indexOf('application/json')<0){return r.text().then(function(t){var hint=t.trim().slice(0,30);if(hint.indexOf('<!DOCTYPE')===0||hint.indexOf('<html')===0)throw new Error('Backend API not active on this deployment. Deploy with Node/server.js or Vercel serverless functions, not static-only hosting.');throw new Error('API returned '+(ct||'non-JSON')+' (HTTP '+r.status+')')})}return r.json().then(function(j){if(!r.ok||!j.ok)throw new Error(j.error||('HTTP '+r.status));return j})})}
function runTickerSearch(q){byId('searchStatus').textContent='Searching market…';apiJSON('/api/search?q='+encodeURIComponent(q)).then(function(j){marketOnline=true;byId('searchStatus').textContent=j.items.length+' result(s)';byId('searchResults').innerHTML=j.items.map(function(x,i){return '<div class="item"><div class="section-title"><div><div class="title">'+esc(x.symbol)+' · '+esc(x.name)+'</div><div class="meta">'+esc(x.exchange||'')+' · '+esc(x.currency||'')+' · '+esc(x.asset||'')+' · '+esc(x.provider||'')+'</div></div><button class="btn primary" data-pick="'+i+'">Add</button></div></div>'}).join('');Array.prototype.forEach.call(document.querySelectorAll('[data-pick]'),function(b){b.onclick=function(){var x=j.items[+this.getAttribute('data-pick')];openAddPositionModal(x)}})}).catch(function(e){byId('searchStatus').textContent='Search unavailable: '+e.message})}
function openAddPositionModal(x){var old=byId('addPositionModal');if(old)old.remove();var d=document.createElement('div');d.className='modal';d.id='addPositionModal';d.innerHTML='<div class="modalbox" style="width:min(560px,96vw)"><div class="section-title"><div><h2>Add Position</h2><div class="subtle">'+esc(x.symbol)+' · '+esc(x.name)+' · '+esc(x.exchange||'')+' · '+esc(x.currency||'')+'</div></div><button class="btn" id="cancelAddPos">Cancel</button></div><div class="formgrid" style="margin-top:16px;grid-template-columns:1fr 1fr"><div class="field"><label>Quantity</label><input id="newQty" type="number" min="0" step="any" placeholder="e.g. 100"></div><div class="field"><label>Average Cost ('+esc(x.currency||'market currency')+')</label><input id="newAvg" type="number" min="0" step="any" placeholder="e.g. 25.50"></div></div><div id="addPosStatus" class="subtle" style="margin-top:10px">Market price will be fetched automatically after saving.</div><div class="toolbar" style="margin-top:16px;justify-content:flex-end"><button class="btn primary" id="confirmAddPos">Add Position</button></div></div>';document.body.appendChild(d);byId('cancelAddPos').onclick=function(){d.remove()};byId('confirmAddPos').onclick=function(){var qty=Number(byId('newQty').value),avg=Number(byId('newAvg').value);if(!(qty>0)){byId('addPosStatus').textContent='Quantity must be greater than 0.';return}if(!(avg>=0)){byId('addPosStatus').textContent='Average cost must be 0 or greater.';return}commitMarketHolding(x,qty,avg,d)}}
function commitMarketHolding(x,qty,avg,modal){var found=DATA.portfolio.holdings.some(function(h){return h.symbol===x.symbol});if(found){alert('This ticker is already in your portfolio. Edit the existing position instead.');return}var h={symbol:x.symbol,name:x.name||x.symbol,asset:x.asset||'Equity',exchange:x.exchange||'',qty:qty,avg:avg,price:0,currency:x.currency||'USD',day:0,yieldPct:0,risk:50,quoteProvider:'syncing…'};DATA.portfolio.holdings.push(h);persist();var status=byId('addPosStatus');if(status)status.textContent='Saving position and syncing market quote…';refreshQuote(x.symbol).then(function(){persist();if(modal&&modal.parentNode)modal.remove();var sm=byId('searchModal');if(sm)sm.remove();var em=byId('editorModal');if(em)em.remove();current='Portfolio';render();refreshHistory(x.symbol,'1Y').then(function(){render()}).catch(function(){})}).catch(function(e){h.quoteProvider='SYNC ERROR · '+e.message;persist();if(modal&&modal.parentNode)modal.remove();var sm=byId('searchModal');if(sm)sm.remove();var em=byId('editorModal');if(em)em.remove();current='Portfolio';render()})}
function refreshQuote(symbol){return apiJSON('/api/quote?symbol='+encodeURIComponent(symbol)).then(function(j){var h=DATA.portfolio.holdings.filter(function(x){return x.symbol===symbol})[0];if(!h)return;j=j.quote;h.price=+j.price||h.price;h.day=+j.percentChange||0;h.currency=j.currency||h.currency;h.exchange=j.exchange||h.exchange;h.name=(j.name&&j.name!==symbol)?j.name:h.name;h.quoteProvider=j.provider+' · '+j.status;h.quoteTime=j.datetime||'';marketOnline=true;persist();return h})}
function applyQuote(q){var h=DATA.portfolio.holdings.filter(function(x){return x.symbol===q.symbol})[0];if(!h)return;h.price=+q.price||h.price;h.day=+q.percentChange||0;h.currency=q.currency||h.currency;h.exchange=q.exchange||h.exchange;h.name=(q.name&&q.name!==q.symbol)?q.name:h.name;h.quoteProvider=(q.provider||'provider')+' · '+(q.status||'LATEST');h.quoteTime=q.datetime||''}
function refreshQuotes(force){if(refreshing)return Promise.resolve();if(document.hidden&&!force)return Promise.resolve();var hs=DATA.portfolio.holdings.filter(function(h){return h.symbol&&+h.qty>0});if(!hs.length)return Promise.resolve();refreshing=true;var symbols=hs.map(function(h){return h.symbol}).join(',');var url='/api/quotes?symbols='+encodeURIComponent(symbols);return apiJSON(url).then(function(j){(j.quotes||[]).forEach(applyQuote);marketOnline=true;lastSyncAt=Date.now();nextSyncAt=lastSyncAt+autoRefreshMs;persist();render();return j}).catch(function(){return Promise.all(hs.map(function(h){return refreshQuote(h.symbol).catch(function(){return null})})).then(function(){lastSyncAt=Date.now();nextSyncAt=lastSyncAt+autoRefreshMs;persist();render()})}).finally(function(){refreshing=false})}
function scheduleAutoRefresh(){if(autoTimer)clearInterval(autoTimer);nextSyncAt=Date.now()+autoRefreshMs;autoTimer=setInterval(function(){if(document.hidden)return;if(Date.now()>=nextSyncAt)refreshQuotes(false)},1000)}
function refreshHistory(symbol,range){return apiJSON('/api/history?symbol='+encodeURIComponent(symbol)+'&range='+encodeURIComponent(range)).then(function(j){var h=DATA.portfolio.holdings.filter(function(x){return x.symbol===symbol})[0];if(!h)return;h.history=h.history||{};h.history[range]=(j.history.points||[]).map(function(x){return +x.c}).filter(function(x){return isFinite(x)});h.historyProvider=j.history.provider;persist();return h})}
function refreshVisibleHistories(){if(detailSymbol){refreshHistory(detailSymbol,assetRange).then(render).catch(function(){})}else if(current==='Portfolio'){DATA.portfolio.holdings.forEach(function(h){if(!(h.history&&h.history['1Y']))refreshHistory(h.symbol,'1Y').then(render).catch(function(){})})}else if(current==='Dashboard'){DATA.portfolio.holdings.forEach(function(h){if(!(h.history&&h.history[portRange]))refreshHistory(h.symbol,portRange).then(render).catch(function(){})})}}
function persist(){try{localStorage.setItem(LS,JSON.stringify(DATA.portfolio))}catch(e){}}
function restore(){try{var p=localStorage.getItem(LS)||localStorage.getItem('portfolioPulsePortfolioV4');if(p){DATA.portfolio=JSON.parse(p);localStorage.setItem(LS,JSON.stringify(DATA.portfolio))}}catch(e){}}
function dl(name,text,type){var a=document.createElement('a');a.href='data:'+(type||'application/json')+';charset=utf-8,'+encodeURIComponent(text);a.download=name;document.body.appendChild(a);a.click();a.remove()}
function exportCSV(){var rows=[['Symbol','Name','Asset','Qty','AvgCost','MarketPrice','Currency','Provider']];DATA.portfolio.holdings.forEach(function(h){rows.push([h.symbol,h.name,h.asset,h.qty,h.avg,h.price,h.currency,h.quoteProvider||''])});dl('portfolio.csv',rows.map(function(r){return r.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"'}).join(',')}).join('\n'),'text/csv')}
function exportJSON(){dl('portfolio.json',JSON.stringify(DATA.portfolio,null,2),'application/json')}
function fetchJSON(url){return fetch(url,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})}
function loadExternal(){if(location.protocol==='file:'||!window.fetch)return;fetchJSON('./data/portfolio.json').then(function(p){DATA.portfolio=p;externalLoaded=true;restore();render();refreshQuotes()}).catch(function(){restore();render();refreshQuotes()})}
function checkMarket(){if(location.protocol==='file:')return;apiJSON('/api/health').then(function(j){marketOnline=!!(j.ok&&(j.providers.twelve||j.providers.finnhub||j.providers.alpha));if(j.autoRefreshMs)autoRefreshMs=Math.max(10000,+j.autoRefreshMs||30000);render();scheduleAutoRefresh();if(marketOnline)refreshQuotes(true)}).catch(function(){scheduleAutoRefresh()})}
window.onerror=function(msg,src,line,col){var f=byId('fatal');f.style.display='block';f.innerHTML='<b>Runtime error</b><br>'+esc(msg)+'<br><small>'+esc(src+':'+line+':'+col)+'</small>'};document.addEventListener('visibilitychange',function(){if(!document.hidden&&marketOnline){nextSyncAt=0;refreshQuotes(true)}});window.addEventListener('online',function(){checkMarket()});restore();render();setTimeout(loadExternal,0);setTimeout(checkMarket,50);
})();
</script></body></html>
